<svg xmlns="http://www.w3.org/2000/svg" viewBox="115 115 270 270" width="100%" height="100%">
  <!-- Quadrado exterior: branco com borda preta -->
  <rect x="125" y="125" width="250" height="250" rx="60" fill="#ffffff" stroke="#000000" stroke-width="6"/>

  <!-- Balão de fala: branco com borda preta -->
  <path d="M 250 145
           C 192 145 145 192 145 250
           C 145 308 192 355 250 355
           C 267 355 283 351 297 344
           L 332 360
           L 320 325
           C 342 305 355 279 355 250
           C 355 192 308 145 250 145 Z"
        fill="#ffffff" stroke="#000000" stroke-width="5"/>

  <!-- Linhas de texto: pretas -->
  <g stroke="#000000" stroke-width="8" stroke-linecap="round">
    <line x1="185" y1="200" x2="270" y2="200" />
    <line x1="185" y1="230" x2="260" y2="230" />
    <line x1="185" y1="260" x2="315" y2="260" />
    <line x1="185" y1="290" x2="315" y2="290" />
  </g>

  <!-- Lápis: contorno preto, preenchimentos em tons de cinza sólidos -->
  <g transform="translate(285, 215) rotate(-35) scale(1.1)">
    <polygon points="0,0 25,-12 25,12" fill="#ffffff" stroke="#000000" stroke-width="3"/>
    <polygon points="0,0 7,-3.5 7,3.5" fill="#000000" />
    <rect x="25" y="-12" width="60" height="12" fill="#d9d9d9" stroke="#000000" stroke-width="3"/>
    <rect x="25" y="0" width="60" height="12" fill="#a6a6a6" stroke="#000000" stroke-width="3"/>
    <path d="M 85 -12 L 105 -12 C 110 -12 110 12 105 12 L 85 12 Z" fill="#ffffff" stroke="#000000" stroke-width="3"/>
    <line x1="85" y1="-12" x2="85" y2="12" stroke="#000000" stroke-width="3"/>
  </g>
</svg>
